<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Native Longshot 设置</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div><h1>Native Longshot</h1><span class="version"></span></div><button id="theme" aria-label="切换主题" title="切换明暗主题">◔</button></header>
<main>
<section><label class="switch-row"><span><strong>在 ChatGPT / Gemini 上开启提示词管理器</strong><small>悬浮球管理提示词，输入 / 快速调用。</small></span><input id="prompts" type="checkbox" role="switch"><i aria-hidden="true"></i></label><button id="open-prompts" class="wide">打开提示词库</button></section>
<section><h2>提示词数据</h2><p>将保存的提示词导出或导入为本地 JSON 文件。</p><div class="two"><button id="export">↓ 导出</button><button id="import">↑ 导入</button></div><input id="file" type="file" accept=".json,application/json" hidden><small class="hint">追加合并，重复项跳过；支持 Voyager 提示词备份。</small></section>
<section><h2>页面布局</h2><label class="switch-row"><span><strong>调整回复宽度</strong><small>提问与回复同步扩宽，提问靠右对齐；输入框保持原样。</small></span><input id="widthEnabled" type="checkbox" role="switch"><i aria-hidden="true"></i></label><div id="width-controls"><div class="range-label"><label for="width">回复宽度</label><output id="width-value" for="width">85%</output></div><input id="width" type="range" min="50" max="100" step="1"><div class="presets"><button data-width="65">紧凑</button><button data-width="85">宽屏</button><button data-width="100">铺满</button><button id="native-width">原始宽度</button></div></div><hr><label class="switch-row"><span><strong>对话时间线</strong><small>标尺导航、问题与回复搜索、收藏和跳转。</small></span><input id="timeline" type="checkbox" role="switch"><i aria-hidden="true"></i></label><div id="timeline-controls"><div class="range-label"><label for="timeline-style">显示样式</label><select id="timeline-style"><option value="dots">圆点节点</option><option value="ruler">标尺</option><option value="compact">紧凑节点</option></select></div><div class="range-label"><label for="timeline-motion">跳转方式</label><select id="timeline-motion"><option value="smooth">平滑滚动</option><option value="instant">立即跳转</option></select></div><div class="two"><button id="open-timeline">搜索与收藏</button><button id="reset-timeline">重置位置</button></div><small class="hint">拖动标尺顶部调整位置。只显示当前已加载的消息。</small></div></section>
<section><h2>插件</h2><label class="switch-row"><span><strong>公式复制</strong><small>悬停公式后，一键复制原始 LaTeX。</small></span><input id="latex" type="checkbox" role="switch"><i aria-hidden="true"></i></label></section>
<p id="status" role="status" aria-live="polite"></p><footer>完全本地处理 · 设置保存到此浏览器</footer>
</main><script type="module" src="popup.js"></script></body></html>
