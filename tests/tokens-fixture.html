<!doctype html><html class="dark"><head><meta charset="utf-8"><style>:root{color-scheme:dark}body{font:16px/1.6 system-ui;background:#171717;color:#eee;margin:40px}form{position:fixed;bottom:60px;left:10%;width:70%;padding:18px;border-radius:20px;background:#282828}#prompt-textarea{min-height:70px;outline:none;white-space:pre-wrap;width:100%;box-sizing:border-box;font:16px/1.6 system-ui;background:#282828;color:#eee;border:0}button{font:inherit}.katex{font-size:22px;display:inline-block}annotation{display:none}.katex-display{display:block;margin:30px 0}</style></head><body><div class="katex"><span class="katex-html">x²</span><math><semantics><annotation encoding="application/x-tex">x^2</annotation></semantics></math></div><div class="katex-display"><span class="katex"><span class="katex-html">∫f(x)dx</span><math display="block"><semantics><annotation encoding="application/x-tex">\int f(x)\,dx</annotation></semantics></math></span></div><form><div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="消息"></div><button type="submit" data-testid="send-button" aria-label="发送提示">发送</button></form><script>
let editor=document.querySelector('#prompt-textarea');if(location.search.includes('textarea')){const input=document.createElement('textarea');input.id='prompt-textarea';input.setAttribute('aria-label','消息');editor.replaceWith(input);editor=input;}
const isText=()=>editor instanceof HTMLTextAreaElement;window.sentTexts=[];
const saved=sessionStorage.getItem('fixture-draft');if(saved){if(isText())editor.value=saved;else editor.innerHTML=saved;}
document.addEventListener('input',e=>{if(e.target===editor)sessionStorage.setItem('fixture-draft',isText()?editor.value:editor.innerHTML);});
document.addEventListener('keydown',e=>{if(e.target===editor&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.querySelector('form').requestSubmit();}});
document.querySelector('form').onsubmit=e=>{e.preventDefault();window.sentTexts.push(isText()?editor.value:editor.innerText);};
window.rebuildEditor=()=>{const fresh=editor.cloneNode(true);editor.replaceWith(fresh);editor=fresh;};
</script></body></html>
